<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyage Interview Report JSON</title>
  <style>
    body {
      font-family: monospace;
      padding: 1rem;
      background: black;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>

<body>
  <pre id="reportJson">Loading report…</pre>

  <script type="module">
    const REPORT_STORAGE_KEY = "voyage_latest_report";
    const reportEl = document.getElementById("reportJson");

    function loadReport() {
      try {
        const raw = sessionStorage.getItem(REPORT_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return  parsed?.report || null;
      } catch {
        return null;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const payload = loadReport();
      if (!payload) {
        reportEl.textContent = "No report data found.";
        return;
      }
      reportEl.textContent = JSON.stringify(payload, null, 1);
    });
  </script>
</body>

</html>
